# Copy to secret.yaml, fill in, and keep it out of git.
#
# secret.yaml is gitignored. For anything beyond a home cluster, generate this
# from a real secret store (sealed-secrets, External Secrets, SOPS) rather than
# committing it anywhere.
#
#   kubectl -n dober-dan create secret generic dober-dan \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 48)"
apiVersion: v1
kind: Secret
metadata:
  name: dober-dan
  namespace: dober-dan
type: Opaque
stringData:
  # Used by both Postgres and the app's DATABASE_URL.
  POSTGRES_PASSWORD: change-me
  # At least 32 characters. openssl rand -base64 48
  SESSION_SECRET: change-me-to-at-least-thirty-two-characters
  # Optional. Absent means the teacher's AI tools are simply not there.
  ANTHROPIC_API_KEY: ""
  # Optional. Absent means the digest waits in the app instead of being mailed.
  SMTP_URL: ""
