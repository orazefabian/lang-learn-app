# Single-host deployment: app + Postgres + Piper, with a volume for audio.
# Whisper (ASR) joins in build step 5.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-slovenscina}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slo} -d ${POSTGRES_DB:-slovenscina}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  piper:
    build:
      context: ./docker/piper
      dockerfile: Dockerfile
      args:
        PIPER_VOICE: ${PIPER_VOICE:-sl_SI-artur-medium}
    image: slovenscina/piper:latest
    restart: unless-stopped
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-sl_SI-artur-medium}
    # CPU-bound and single-threaded per request. A short phrase takes roughly a
    # second on a modest core; audio is generated in batches, never per request.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
        reservations:
          memory: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: slovenscina/app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Started, not healthy: without TTS the app runs, it just has no audio.
      piper:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-slo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-slovenscina}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-90}
      MEDIA_ROOT: /media
      PIPER_URL: http://piper:5000
      PIPER_VOICE: ${PIPER_VOICE:-sl_SI-artur-medium}
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-false}
      SMTP_URL: ${SMTP_URL:-}
      DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - media:/media
    ports:
      # Bound to localhost; put your existing reverse proxy in front of this.
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  db-data:
  media:
