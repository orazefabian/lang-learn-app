# Everything that can run without a browser or a cluster.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Hook rules, async client components, raw <img>/<a>: what tsc cannot see.
      - run: pnpm lint
      # A schema edit without `pnpm db:generate` ships code that expects columns
      # the boot-time migration never creates. Generating offline must be a no-op.
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            git status --porcelain drizzle/
            echo "::error::src/db/schema changed without a migration. Run pnpm db:generate and commit drizzle/."
            exit 1
          fi
      # Scheduling, scoring, the backlog cap, config parsing, the manifests,
      # and the German/English message catalogs staying in step.
      - run: pnpm test
      # PGlite over its wire protocol: no service containers needed.
      - run: pnpm test:integration
      - run: pnpm build
        env:
          # The build never connects, but env parsing runs at import time.
          SESSION_SECRET: ci-placeholder-secret-at-least-32-characters
